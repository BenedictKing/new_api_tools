# Air 配置文件 - Go 热重载工具
# 文档: https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "tmp/server"
  full_bin = ""
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "toml", "env"]
  exclude_dir = ["tmp", "vendor", "testdata", "frontend", "dist", "data", ".git", ".github", ".vscode", ".idea"]
  include_dir = []
  include_file = [".env"]
  exclude_file = []
  exclude_unchanged = false
  follow_symlink = false
  delay = 1000
  stop_on_error = true
  log = "build-errors.log"
  send_interrupt = true
  kill_delay = 500
  rerun = false
  rerun_delay = 500
  args_bin = []

[log]
  main_only = false
  time = true

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
  app = ""

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
  keep_scroll = true
