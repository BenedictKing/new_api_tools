basePath: /api
definitions:
  handler.LoginRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  handler.LoginResponse:
    properties:
      expires_at:
        type: string
      message:
        type: string
      success:
        type: boolean
      token:
        type: string
    type: object
  handler.Response:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  service.GenerateConfig:
    properties:
      count:
        type: integer
      expire_date:
        description: date 模式的日期 (YYYY-MM-DD)
        type: string
      expire_days:
        description: days 模式的天数
        type: integer
      expire_mode:
        description: '过期模式: never (永不) / days (N天后) / date (指定日期)'
        type: string
      expire_time:
        description: date 模式的时间 (HH:MM:SS，可选)
        type: string
      name:
        type: string
      prefix:
        type: string
      quota:
        type: integer
      quota_max:
        description: 随机模式最大值
        type: integer
      quota_min:
        description: 随机模式最小值
        type: integer
      quota_type:
        description: '额度模式: fixed (固定) / random (随机)'
        type: string
    type: object
  service.StorageConfig:
    properties:
      auto_cleanup:
        type: boolean
      backup_enabled:
        type: boolean
      backup_path:
        type: string
      cache_enabled:
        type: boolean
      cache_max_size:
        type: integer
      cache_ttl:
        type: integer
      cleanup_interval:
        type: integer
      compress_old_logs:
        type: boolean
      last_updated:
        type: string
      log_retention_days:
        type: integer
    type: object
